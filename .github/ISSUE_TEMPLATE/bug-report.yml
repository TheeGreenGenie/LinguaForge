name: Bug report
description: Something in the app doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS/browser version
      placeholder: iPhone 15, iOS 26.1, installed on the Home Screen
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Language you were studying
      options: ["Yorùbá", "Mandarin Chinese", "Spanish", "French", "Portuguese (Brazil)", "Not language-specific"]
  - type: checkboxes
    id: offline
    attributes:
      label: Context
      options:
        - label: It happened while offline
